spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/banking_db
    username: banking_user
    password: banking_pass123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    show-sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
  jackson:
    serialization:
      indent-output: true

server:
  port: 8001
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.banking: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/user-service.log
    max-size: 10MB
    max-history: 10

app:
  jwtSecret: bankingMicroservicesSecretKeyForJWTTokenGeneration2024
  jwtExpirationMs: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
